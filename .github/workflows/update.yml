name: Update URLHaus Filter

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1,13 * * *'

permissions:
  contents: write

concurrency:
  group: urlhouse-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download original filter
        run: |
          curl -fsSL --retry 3 \
            https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-agh.txt \
            -o urlhaus-original.txt

      - name: Apply exclusions
        run: |
          python3 <<'PY'
          from pathlib import Path

          exclusions = {
              line.strip().lower()
              for line in Path("exclusions.txt").read_text().splitlines()
              if line.strip() and not line.strip().startswith("#")
          }

          original = Path("urlhaus-original.txt").read_text().splitlines()

          if len(original) < 1000:
              raise RuntimeError("Downloaded filter is incomplete")

          filtered = []
          removed = 0

          for line in original:
              rule = line.strip().lower()

              if rule.startswith("||"):
                  host = rule[2:].split("^", 1)[0]

                  if any(
                      host == entry or host.endswith("." + entry)
                      for entry in exclusions
                  ):
                      print(f"Excluded: {line}")
                      removed += 1
                      continue

              filtered.append(line)

          Path("urlhaus-filter-agh.txt").write_text(
              "\n".join(filtered) + "\n"
          )

          print(f"Removed rules: {removed}")
          print(f"Remaining lines: {len(filtered)}")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add urlhaus-filter-agh.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update URLHaus filter"
            git push
          fi
